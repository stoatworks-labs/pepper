    <title>SW Pepper — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try SW Pepper, an FFGL mixer for Resolume, in your browser: Pepper's ghost, a clear sheet at an angle reflecting a hidden screen over the stage behind it, traced per pixel in linear light — the Victorian pane, a Musion-style foil and the phone pyramid, with dispersion, coated foils, polarisation and a rippling foil. The plugin's own GLSL, ported to WebGL2 unedited, fed by a JavaScript port of its CPU half. A demo, not the plugin." />

          <a href="https://github.com/stoatworks-labs/pepper">its repository</a>.
        </p>
