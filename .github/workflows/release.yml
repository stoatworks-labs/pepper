name: release

# Build the Pepper FFGL plugins (a mixer and an effect) for the two platforms Resolume runs on:
#   - macOS   -> universal (arm64 + x86_64) Pepper.bundle and PepperFeed.bundle
#   - Windows -> x64 Pepper.dll and PepperFeed.dll (GLEW static-linked via vcpkg)
# Each ships as a zip, with a .dmg for macOS and an installer for Windows.
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
#
# Dispatching this manually is the cheap way to get a Windows build without
# publishing anything: the release job below is gated on refs/tags/v*, so a
# workflow_dispatch run builds both platforms and skips publication. That is
# how a DLL tested on Windows is the one a tag then ships.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 and never macos-13: the Intel macOS runners are retired,
          # so x86_64 is cross-compiled from Apple Silicon. CMakeLists.txt's
          # CMAKE_OSX_ARCHITECTURES does that on its own.
          - { name: macos-universal, os: macos-15 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Tools off: pgtest links against zlib and CGL and is a developer
      # harness, not something that ships. Its checks run locally via
      # tools/verify.sh, and the GL-free ones in ci.yml.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPEPPER_BUILD_TOOLS=OFF

      # GLEW comes from vcpkg, static-linked (static-md keeps the CRT dynamic
      # so the plugin matches the host) so the .dll has no external
      # glew32.dll runtime dependency.
      #
      # Applocal off: with a static triplet there is no DLL for vcpkg to copy
      # beside the plugins, and its post-build copy step runs once per DLL. The
      # two plugins link in the same instant under --parallel, both copy steps
      # open build/Release together, and one fails with "being used by another
      # process" (exit 32): slipstream's first Windows build, 2026-10-20.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DPEPPER_BUILD_TOOLS=OFF
          -DVCPKG_APPLOCAL_DEPS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      # The shipped DLLs, loaded as a host loads them: see tools/wincheck.ps1.
      # -Params is the control table plus the About block (its text and its
      # buttons); it changes whenever either does.
      - name: Check the DLLs (Windows)
        if: runner.os == 'Windows'
        run: |
          ./tools/wincheck.ps1 -Dll "build/Release/Pepper.dll" -Name "SW Pepper" -Id PG01 -Kind mixer -Params 30 -First "Linear Light"
          if( $LASTEXITCODE ) { exit $LASTEXITCODE }
          ./tools/wincheck.ps1 -Dll "build/Release/PepperFeed.dll" -Name "SW Pepper Feed" -Id PG02 -Kind effect -Params 7 -First "Sides"
          if( $LASTEXITCODE ) { exit $LASTEXITCODE }

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Two bundles: the mixer and the feed effect. FFGL resolves one
            # plugMain per binary, so they cannot share one.
            for name in "Pepper" "PepperFeed"; do
              cp -R "build/$name.bundle" "out/$name.bundle"
              # Sanity-check each bundle really is universal and exports
              # plugMain. An arm64-only build logs as a success, and a bundle
              # that exports nothing loads cleanly and reports no plugins.
              bin="out/$name.bundle/Contents/MacOS/$name"
              # Actions runs `shell: bash` as `bash -eo pipefail`, so
              # `cmd | grep -q X` FAILS when grep FINDS its match (the writer
              # takes SIGPIPE). Captured and matched with `case` instead.
              __archs=$( lipo -archs "$bin" )
              echo "$name architectures: $__archs"
              case "$__archs" in
                *x86_64*arm64* | *arm64*x86_64*) ;;
                *) echo "$name: expected x86_64 and arm64, got: $__archs"; exit 1 ;;
              esac
              __symbols=$( nm -gU "$bin" )
              case "$__symbols" in
                *_plugMain*) ;;
                *) echo "$name: expected _plugMain"; exit 1 ;;
              esac
            done
          else
            cp "build/Release/Pepper.dll" "out/Pepper.dll"
            cp "build/Release/PepperFeed.dll" "out/PepperFeed.dll"
          fi
          # GLEW and the FFGL SDK are BSD-licensed and built into the binary,
          # and the coat's refractive indices are refractiveindex.info data,
          # so their notices travel with it.
          cp ATTRIBUTIONS.md out/
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../pepper-${{ matrix.name }}.zip" ./*
          else
            zip -r "../pepper-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, but deliberately NOT a .pkg. An FFGL plugin's destination is
        # per-user and edition-specific -- the README installs to
        # ~/Documents/Resolume {Arena,Avenue}/Extra Effects -- so a .pkg would
        # have to guess a path and would silently install to the wrong one for
        # half of users.
        run: |
          source scripts/release-lib.sh
          rl_init "Pepper" pepper "${{ steps.ver.outputs.version }}" \
            com.stoatworks.pepper "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          rl_adhoc_sign "out/Pepper.bundle"
          rl_adhoc_sign "out/PepperFeed.bundle"
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pepper-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded. --ffgl points its directory page at
    # Documents\Resolume Arena\Extra Effects, the folder Resolume reads (a
    # mixer loads from there too), and leaves it editable for Avenue's.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Pepper" pepper "$version" com.stoatworks.pepper "$PWD/installers"
          zip="$(find artifacts -name "pepper-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --ffgl: per user, into Documents\Resolume Arena\Extra Effects
          # (Avenue's where only Avenue is installed), with no shortcut and no
          # PATH entry.
          rl_nsis windows-x86_64 "$stage" --ffgl
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: pepper-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
